<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Tip calculator app</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
<link rel="stylesheet" href="index.css">
</head>
<body>
<!--
  Bill

  Select Tip %
  5%
  10%
  15%
  25%
  50%
  Custom

  Number of People

  Tip Amount
  / person

  Total
  / person

  Reset
-->
  <main id="container">
    <img src="images/logo.svg">
<div id="contain">
<section>
  <h4>Bills</h4>
  <aside>
    <img src="images/icon-dollar.svg">
    <p>142.55</p>
  </aside>
  <h4>Select Tip %</h4>
  <summary>
    <div>5%</div>
    <div>10%</div>
    <div id="only">15%</div>
  </summary>
  <article>
    <div>20%</div>
    <div>25%</div>
    <div>Custom</div>
  </article>
  <h4>Number of People</h4>
  <aside>
    <img src="images/icon-person.svg">
    <p>5</p>
  </aside>
</section>
<section>
   <div>
<p>Tip Amount
 <br> <span>/ person</span></p>
<h2>$4.27</h2>
   </div>
  <div>
    <p>
Total
 <br><span>/ person</span>
  </p>
<h2>$32.79</h2>
  </div>
  <button>Reset</button>
</section>
</div>
  </main>
</body>
</html>
